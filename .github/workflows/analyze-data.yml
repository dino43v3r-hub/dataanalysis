name: Analyze Data

on:
  workflow_dispatch:
    inputs:
      resolve_with_groq:
        description: "Generate Groq-assisted issue resolution notes"
        required: false
        type: boolean
        default: false
      groq_model:
        description: "Groq model to use when Groq resolution is enabled"
        required: false
        type: string
        default: "openai/gpt-oss-20b"
      analysis_goal:
        description: "Question or goal to frame the analysis"
        required: false
        type: string
        default: "Find why C drives are filling up and recommend remediation."
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANALYSIS_GOAL: ${{ inputs.analysis_goal }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run analyzer
        if: ${{ !inputs.resolve_with_groq }}
        run: python data_analyzer.py --input data --output reports --goal "$ANALYSIS_GOAL"

      - name: Run analyzer with Groq
        if: ${{ inputs.resolve_with_groq }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ inputs.groq_model }}
        run: python data_analyzer.py --input data --output reports --resolve-with-groq --goal "$ANALYSIS_GOAL"

      - name: Upload reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: analysis-reports
          path: reports/
          retention-days: 7
